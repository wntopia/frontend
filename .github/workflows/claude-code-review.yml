# .github/workflows/claude-code-review.yml
# PR이 처음 열릴 때 Claude가 PR diff를 리뷰하고 인라인 코멘트와 요약 코멘트를 남깁니다.
# 이미 리뷰한 PR은 다시 리뷰하지 않고, PR에 `/claude-review` 댓글을 달면 그때 다시 리뷰합니다.
# 코멘트 작성자: Claude GitHub App (github_token 미지정 시 기본값)
# 모델 호출 인증: 레포 시크릿 CLAUDE_CODE_OAUTH_TOKEN (구독 사용량에서 차감)

name: Claude Code Review

on:
  pull_request:
    # 초안으로 연 PR은 리뷰 요청으로 바뀔 때 리뷰합니다
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  review:
    # 댓글은 PR에 달린 `/claude-review`만 받습니다. 댓글 작성자의 쓰기 권한은 action이 확인합니다.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/claude-review'))
    # 같은 PR의 리뷰가 겹치면 앞의 리뷰가 끝난 뒤에 돌립니다. 워크플로가 아니라 작업 단위로 걸어야
    # 명령이 아닌 댓글(Claude 자신의 요약 코멘트 포함)로 생긴 실행이 진행 중인 리뷰를 건드리지 않습니다.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write   # Claude GitHub App 인증에 필수
    steps:
      # 요약 코멘트에 심어 둔 표시로 이미 리뷰한 PR인지 판단합니다. 댓글 명령은 이 확인 없이 다시 리뷰합니다.
      - name: 이미 리뷰한 PR인지 확인
        id: reviewed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "claude[bot]" and (.body | contains("<!-- claude-code-review -->"))) | .id')
          if [ -n "$found" ]; then
            echo "이미 리뷰한 PR이라 건너뜁니다. 다시 리뷰하려면 PR에 /claude-review 댓글을 다세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # 댓글 이벤트에서는 기본 브랜치가 체크아웃되므로 PR의 최신 커밋을 직접 지정합니다
      - uses: actions/checkout@v6
        if: steps.reviewed.outputs.skip != 'true'
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.reviewed.outputs.skip != 'true'
        # Claude가 하위 에이전트를 백그라운드로 띄우면 action이 그 결과를 기다리지 않고
        # 종료해, 리뷰 없이 성공으로 끝납니다. 백그라운드 실행을 꺼서 끝까지 기다리게 합니다.
        # https://github.com/anthropics/claude-code-action/issues/1499
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            이 PR의 diff를 코드 리뷰하고 결과를 PR에 남겨 주세요. 코멘트는 모두 한국어로 씁니다.

            ## 진행 순서
            1. `gh pr view <PR NUMBER> --json title,body,files`로 PR의 의도와 바뀐 파일을 파악합니다.
            2. `gh pr diff <PR NUMBER>`로 diff를 읽습니다. 리뷰 대상은 이 diff에서 추가·수정된 줄입니다.
            3. 저장소 루트의 `CLAUDE.md`와 `AGENTS.md`를 읽습니다. 이 프로젝트의 아키텍처·스타일 규칙이 여기 있습니다.
            4. 판단에 맥락이 필요하면 Read·Grep·Glob으로 저장소 파일을 직접 열어 확인합니다.
               체크아웃된 코드는 이 PR의 최신 커밋입니다.
            5. `gh api repos/<REPO>/pulls/<PR NUMBER>/comments`로 이미 달린 리뷰 코멘트를 확인하고,
               같은 지적은 다시 달지 않습니다. 다시 리뷰하는 경우라면 새로 찾은 것만 답니다.

            ## 볼 것 (위에 있을수록 중요)
            - [버그] 실행하면 깨지거나 결과가 틀리는 코드: 타입 오류, 잘못된 조건·경계값, 빠진 await,
              null·undefined 처리, React 훅 규칙 위반, 서버·클라이언트 컴포넌트 경계 위반 등
            - [보안] XSS(dangerouslySetInnerHTML, 사용자 입력을 그대로 HTML·URL로 쓰는 곳), 열린 리다이렉트,
              비밀값 노출, 인증 확인 누락
            - [규칙] CLAUDE.md 규칙 위반. 어느 규칙인지 해당 문장을 인용합니다.
            - [제안] 버그는 아니지만 고칠 가치가 분명한 것: 중복 코드, 놓친 엣지 케이스,
              필요 없는 클라이언트 컴포넌트, 읽기 어려운 구조

            ## 달지 말 것
            - 포매터·린터가 잡는 것, 취향 차이
            - 이 PR에서 바뀌지 않은 코드의 문제
            - 확인하지 않은 추측. 파일을 열어 확인할 수 있는 것은 확인한 뒤에만 답니다.

            ## 남기는 방법
            - 문제마다 `mcp__github_inline_comment__create_inline_comment`로 해당 줄에 인라인 코멘트를 답니다
              (`confirmed: true`). 첫머리에 [버그]·[보안]·[규칙]·[제안] 중 하나를 붙이고, 왜 문제인지와
              어떻게 고치면 되는지 적습니다. 몇 줄로 끝나는 수정이면 suggestion 블록을 넣습니다.
            - 같은 문제는 한 번만 답니다. 여러 곳에서 반복되면 한 곳에 달고 나머지 위치를 적습니다.
            - 마지막으로 `gh pr comment`로 요약 코멘트를 하나 남깁니다. 첫 줄에는 `<!-- claude-code-review -->`를
              그대로 넣습니다 (이미 리뷰한 PR인지 판단하는 표시라 빠지면 안 됩니다). 그 아래에 변경 내용 한두 줄 요약,
              종류별 지적 개수, 머지 전에 꼭 고쳐야 할 것을 적습니다. 지적할 것이 없으면 무엇을 확인했는지 적습니다.
          # PR 조회·diff·코멘트 작성과 기존 리뷰 코멘트 조회만 허용합니다. 파일 읽기(Read·Grep·Glob)는 따로 허용하지 않아도 됩니다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments:*)"
