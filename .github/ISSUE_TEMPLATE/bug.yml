name: Bug
description: 재현할 수 있는 버그나 전에 되던 것이 깨진 경우를 알립니다.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[영역] 무엇이 잘못되는지` 형식으로 씁니다. 영역은 문제가 보이는 화면이나 슬라이스 이름입니다.
        예: `document` · `history` · `edit` · `search` · `home` · `mypage` · `auth` · `api`, 여러 곳에 걸치면 `global`
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 무엇이 잘못되었나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 일으키는 가장 짧은 순서를 적습니다.
      placeholder: |
        1. `/document/1`에 들어간다
        2. ...을 누른다
        3. ...이 보인다
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 원래 어떻게 되어야 하나요?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 대신 무슨 일이 일어났나요? 화면에 보인 오류 문구나 스크린샷을 붙입니다.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 환경, 콘솔·서버 로그, 관련 이슈나 PR
      placeholder: |
        - 브라우저:
        - 화면 모드: 라이트 / 다크
        - 로그인 여부:
        - 연결한 백엔드: 개발 서버 / 로컬
    validations:
      required: false
