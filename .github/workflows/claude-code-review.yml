# .github/workflows/claude-code-review.yml
# PR이 처음 열릴 때 Claude가 PR diff를 리뷰하고 인라인 코멘트와 요약 코멘트를 남깁니다.
# 이미 리뷰한 PR은 다시 리뷰하지 않고, PR에 `/claude-review` 댓글을 달면 그때 다시 리뷰합니다.
# 코멘트 작성자: Claude GitHub App (github_token 미지정 시 기본값)
# 모델 호출 인증: 레포 시크릿 CLAUDE_CODE_OAUTH_TOKEN (구독 사용량에서 차감)

name: Claude Code Review

on:
  pull_request:
    # 초안으로 연 PR은 리뷰 요청으로 바뀔 때 리뷰합니다
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  review:
    # 댓글은 PR에 달린 `/claude-review`만 받습니다. 댓글 작성자의 쓰기 권한은 action이 확인합니다.
    # 봇이 연 PR(harness-sync 등)은 action이 봇 실행을 거부해 실패로 남으므로 자동 리뷰를 건너뜁니다.
    # 리뷰가 필요하면 사람이 `/claude-review` 댓글을 달면 됩니다.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/claude-review'))
    # 같은 PR의 리뷰가 겹치면 앞의 리뷰가 끝난 뒤에 돌립니다. 워크플로가 아니라 작업 단위로 걸어야
    # 명령이 아닌 댓글(Claude 자신의 요약 코멘트 포함)로 생긴 실행이 진행 중인 리뷰를 건드리지 않습니다.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write   # Claude GitHub App 인증에 필수
    steps:
      # 요약 코멘트에 심어 둔 표시로 이미 리뷰한 PR인지 판단합니다. 댓글 명령은 이 확인 없이 다시 리뷰합니다.
      - name: 이미 리뷰한 PR인지 확인
        id: reviewed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "claude[bot]" and (.body | contains("<!-- claude-code-review -->"))) | .id')
          if [ -n "$found" ]; then
            echo "이미 리뷰한 PR이라 건너뜁니다. 다시 리뷰하려면 PR에 /claude-review 댓글을 다세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # 댓글 이벤트에서는 기본 브랜치가 체크아웃되므로 PR의 최신 커밋을 직접 지정합니다.
      # 파일마다 `git diff <base>...HEAD`로 diff를 보려면 merge-base가 있어야 해서 히스토리를 모두 받습니다.
      - uses: actions/checkout@v6
        if: steps.reviewed.outputs.skip != 'true'
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0

      # 댓글 이벤트에는 PR 정보가 실려 오지 않아 base 브랜치를 API로 읽습니다
      - name: base 브랜치 확인
        id: base
        if: steps.reviewed.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          echo "ref=origin/$base" >> "$GITHUB_OUTPUT"

      # AGENTS.md대로 Next API는 설치된 버전의 문서(node_modules/next/dist/docs)로 확인하게 합니다.
      # PR의 코드는 믿을 수 없으므로 패키지 설치 스크립트는 돌리지 않습니다.
      - name: 의존성 설치 (Next 문서 확인용)
        if: steps.reviewed.outputs.skip != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        if: steps.reviewed.outputs.skip != 'true'
        # Claude가 하위 에이전트를 백그라운드로 띄우면 action이 그 결과를 기다리지 않고
        # 종료해, 리뷰 없이 성공으로 끝납니다. 백그라운드 실행을 꺼서 끝까지 기다리게 합니다.
        # https://github.com/anthropics/claude-code-action/issues/1499
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}
            BASE: ${{ steps.base.outputs.ref }}

            이 PR을 코드 리뷰하고 결과를 PR에 남겨 주세요. 코멘트는 모두 한국어로 씁니다.
            리뷰의 목적은 작성자가 놓친 문제를 찾는 것입니다. 문제없는 항목을 나열하는 것은 리뷰가 아닙니다.

            ## 진행 순서
            1. `gh pr view <PR NUMBER> --json title,body`로 PR의 의도를 파악합니다.
            2. 저장소 루트의 `CLAUDE.md`와 `AGENTS.md`를 읽습니다. 이 프로젝트의 아키텍처·스타일 규칙이 여기 있습니다.
            3. `git diff <BASE>...HEAD --stat`으로 바뀐 파일 목록을 봅니다.
               PR 전체 diff를 한 번에 출력하지 않습니다 (`gh pr diff` 금지). 큰 PR은 출력이 잘려 diff의 일부만 보게 됩니다.
            4. 바뀐 파일을 하나씩 모두 리뷰합니다. lockfile·이미지처럼 읽을 코드가 없는 파일만 건너뜁니다.
               - `git diff <BASE>...HEAD -- <파일>`로 그 파일의 diff를 읽습니다. 리뷰 대상은 추가·수정된 줄입니다.
               - 같은 파일을 Read로 끝까지 읽습니다. diff 조각만으로는 주변 코드와 어떻게 맞물리는지 알 수 없습니다.
                 체크아웃된 코드는 이 PR의 최신 커밋입니다.
               - 바뀐 함수·컴포넌트·타입을 쓰는 곳과, 그것이 부르는 코드를 Grep으로 찾아 함께 읽습니다.
               - Next.js API의 동작은 기억에 기대지 말고 `node_modules/next/dist/docs/`에서 확인합니다.
                 이 저장소의 Next는 학습 데이터와 API가 다릅니다 (AGENTS.md).
            5. `gh api repos/<REPO>/pulls/<PR NUMBER>/comments`로 이미 달린 리뷰 코멘트를 확인하고,
               같은 지적은 다시 달지 않습니다. 다시 리뷰하는 경우라면 새로 찾은 것만 답니다.
            6. 모든 파일을 본 뒤에 코멘트를 답니다.

            ## 볼 것 (위에 있을수록 중요)
            - [버그] 실행하면 깨지거나 결과가 틀리는 코드: 타입 오류, 잘못된 조건·경계값, 빠진 await,
              null·undefined 처리, 로딩·빈 상태·실패 처리 누락, 경쟁 상태, React 훅 규칙 위반,
              서버·클라이언트 컴포넌트 경계 위반(클라이언트 파일이 `server.ts`를 import 하는 등),
              바꾼 함수의 기존 호출부가 깨지는 경우 등
            - [보안] XSS(dangerouslySetInnerHTML, 사용자 입력을 그대로 HTML·URL로 쓰는 곳), 열린 리다이렉트,
              비밀값 노출, 인증 확인 누락
            - [규칙] CLAUDE.md 규칙 위반. 어느 규칙인지 해당 문장을 인용합니다.
            - [제안] 버그는 아니지만 고칠 가치가 분명한 것: 중복 코드, 놓친 엣지 케이스, 쓰이지 않는 코드,
              필요 없는 클라이언트 컴포넌트, 읽기 어려운 구조

            ## 달지 말 것
            - 포매터·린터·타입 검사가 잡는 것, 취향 차이
            - 이 PR에서 바뀌지 않은 코드의 문제
            - 확인할 수 있는데 확인하지 않은 추측. 파일을 열어 확인한 뒤에만 인라인 코멘트로 답니다.
              확인할 방법이 없어 확신하지 못하는 것은 버리지 말고 요약 코멘트의 [확인 필요]에 적습니다.

            ## 남기는 방법
            - 문제마다 `mcp__github_inline_comment__create_inline_comment`로 해당 줄에 인라인 코멘트를 답니다
              (`confirmed: true`). 첫머리에 [버그]·[보안]·[규칙]·[제안] 중 하나를 붙이고, 어떤 입력·상황에서
              무엇이 잘못되는지와 어떻게 고치면 되는지 적습니다. 몇 줄로 끝나는 수정이면 suggestion 블록을 넣습니다.
            - 같은 문제는 한 번만 답니다. 여러 곳에서 반복되면 한 곳에 달고 나머지 위치를 적습니다.
            - 마지막으로 `gh pr comment`로 요약 코멘트를 하나 남깁니다. 첫 줄에는 `<!-- claude-code-review -->`를
              그대로 넣습니다 (이미 리뷰한 PR인지 판단하는 표시라 빠지면 안 됩니다). 그 아래에 다음만 적습니다.
              - 변경 내용 한두 줄 요약
              - 종류별 지적 개수와 머지 전에 꼭 고쳐야 할 것
              - [확인 필요]: 의심되지만 확인하지 못한 것과 왜 확인하지 못했는지 (없으면 생략)
              - 리뷰 범위: 리뷰한 파일 수와 건너뛴 파일
              문제없다고 본 항목을 나열하지 않습니다.
          # 기본 모델(Sonnet)은 4만~8만 자짜리 diff를 1분 안에 훑고 지적 없이 끝냈습니다.
          # 리뷰는 PR마다 한 번만 돌기 때문에 Opus로 돌립니다.
          # 허용하는 명령은 PR 조회, 파일별 diff·히스토리 조회, 코멘트 작성과 기존 리뷰 코멘트 조회뿐입니다.
          # 파일 읽기(Read·Grep·Glob)는 따로 허용하지 않아도 됩니다.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
